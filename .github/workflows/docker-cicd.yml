name: Build, Test, and Push Docker Image

on:
  push:
    branches: [ "main", "test-workflows" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ github.run_number }}

      - name: Start Container for Testing
        run: docker run -d -p 80:8080 --name test-app ghcr.io/${{ github.repository }}:${{ github.run_number }}

      - name: Run Tests
        uses: agavrushenko/liatrio-github-actions/apprentice-action@fix/apprentice-action-minified-json-test

      - name: Post-test cleanup
        if: always() 
        run: docker rm -f test-app

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Tested Image to GHCR
        run: docker push ghcr.io/${{ github.repository }}:${{ github.run_number }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with CGP
        uses: google-github-actions/auth@v3
        with:
          project_id: liatrio-apprenticeship-510421
          service_account: github-actions-sa@liatrio-apprenticeship-510421.iam.gserviceaccount.com
          workload_identity_provider: projects/106678521584/locations/global/workloadIdentityPools/github-pool/providers/github-provider

      - name: Deploy new container to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: liatrio-apprenticeship-510421
          service: containerized-api-cicd 
          region: us-west1
          image: ghcr.io/${{ github.repository }}:${{ github.run_number }}
