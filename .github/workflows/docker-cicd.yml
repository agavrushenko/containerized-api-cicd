name: Build, Test, and Push Docker Image

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ github.run_number }}

      - name: Start Container for Testing
        run: docker run -d -p 80:8080 --name test-app ghcr.io/${{ github.repository }}:${{ github.run_number }}

      - name: Run Tests
        uses: liatrio/github-actions/apprentice-action@master

      - name: Post-test cleanup
        if: always() 
        run: docker rm -f test-app

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Tested Image to GHCR
        run: docker push ghcr.io/${{ github.repository }}:${{ github.run_number }}
